data:
  jsut_root: data/jsut_ver1.1
  cache_dir: data/cache/basic5000
  test_size: 200
  seed: 0

audio:
  sample_rate: 16000
  n_mels: 80

model:
  d_model: 128
  n_layers: 6
  n_heads: 4
  ffn_dim: 512
  conv_kernel: 7
  dropout: 0.1
  ctc_gate: true
  gate_min_weight: 0.3

train:
  batch_size: 8
  num_epochs: 40
  lr: 0.001
  warmup_steps: 800
  weight_decay: 0.01
  grad_clip: 5.0
  specaug: true
  ctc_weight_char: 1.0
  ctc_weight_mora: 0.5
  ema_decay: 0.999
  log_interval: 50
  num_threads: 12
  save_dir: runs/basic5000_gate03